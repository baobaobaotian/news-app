<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>热点聚合 - 全网热点一站看</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            padding-bottom: 60px;
        }
        .header {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            color: white;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        .header-icons {
            display: flex;
            gap: 16px;
        }
        .header-icons svg {
            width: 24px;
            height: 24px;
        }
        .tabs {
            background: #f5f5f5;
            padding: 8px 12px;
            position: sticky;
            top: 48px;
            z-index: 99;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            display: inline-block;
            padding: 6px 16px;
            margin-right: 8px;
            background: white;
            border-radius: 16px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active {
            background: #ff6b6b;
            color: white;
        }
        .news-list {
            padding: 8px 12px;
        }
        .news-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 8px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .news-item:active {
            transform: scale(0.98);
        }
        .rank {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .rank-1 { background: #ff4d4d; color: white; }
        .rank-2 { background: #ff9500; color: white; }
        .rank-3 { background: #ffcc00; color: white; }
        .rank-other { background: #f0f0f0; color: #666; }
        .news-content {
            flex: 1;
            min-width: 0;
        }
        .news-title {
            font-size: 15px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #999;
        }
        .tag {
            padding: 2px 6px;
            background: #f5f5f5;
            border-radius: 4px;
            color: #666;
        }
        .hot {
            color: #ff6b6b;
        }
        .arrow {
            color: #ccc;
            flex-shrink: 0;
            align-self: center;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            padding-bottom: env(safe-area-inset-bottom, 8px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #999;
            font-size: 11px;
        }
        .nav-item.active {
            color: #ff6b6b;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
        }
        .refresh-btn {
            position: fixed;
            bottom: 80px;
            right: 16px;
            width: 48px;
            height: 48px;
            background: #ff6b6b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(255,107,107,0.4);
            cursor: pointer;
            border: none;
        }
        .refresh-btn svg {
            width: 24px;
            height: 24px;
        }
        .refresh-btn.spin svg {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }
        .skeleton {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 8px;
        }
        .skeleton-line {
            height: 16px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <span>热点聚合</span>
            </div>
            <div class="header-icons">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </div>
        </div>
    </header>

    <div class="tabs">
        <span class="tab active" data-cat="all">全部</span>
        <span class="tab" data-cat="hot">热搜</span>
        <span class="tab" data-cat="tech">科技</span>
        <span class="tab" data-cat="ent">娱乐</span>
        <span class="tab" data-cat="sport">体育</span>
        <span class="tab" data-cat="finance">财经</span>
        <span class="tab" data-cat="game">游戏</span>
    </div>

    <div class="news-list" id="newsList">
        <div class="loading">加载中...</div>
    </div>

    <button class="refresh-btn" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
    </button>

    <nav class="bottom-nav">
        <div class="nav-item active">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span>首页</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span>发现</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span>我的</span>
        </div>
    </nav>

    <script>
        // 模拟新闻数据
        const mockNews = [
            { id: 1, title: 'OpenAI 发布 GPT-5，性能提升 10 倍', source: '知乎', time: '10分钟前', hot: '234万', category: 'tech' },
            { id: 2, title: '某明星宣布结婚，微博服务器瘫痪', source: '微博', time: '30分钟前', hot: '189万', category: 'ent' },
            { id: 3, title: 'A股大涨，沪指突破 3500 点', source: '财经网', time: '1小时前', hot: '156万', category: 'finance' },
            { id: 4, title: '国足世预赛出线形势分析', source: '体育周报', time: '2小时前', hot: '98万', category: 'sport' },
            { id: 5, title: '《黑神话：悟空》销量破千万', source: '游戏资讯', time: '3小时前', hot: '87万', category: 'game' },
            { id: 6, title: 'iPhone 17 设计图曝光，外观大改', source: '科技日报', time: '4小时前', hot: '76万', category: 'tech' },
            { id: 7, title: '春节档电影票房创纪录', source: '娱乐新闻', time: '5小时前', hot: '65万', category: 'ent' },
            { id: 8, title: '比特币突破 10 万美元大关', source: '区块链资讯', time: '6小时前', hot: '54万', category: 'finance' },
            { id: 9, title: 'NBA 全明星赛名单公布', source: '体育新闻', time: '7小时前', hot: '43万', category: 'sport' },
            { id: 10, title: 'Steam 冬季特卖开始', source: '游戏资讯', time: '8小时前', hot: '32万', category: 'game' },
            { id: 11, title: '华为发布新款折叠屏手机', source: '科技日报', time: '9小时前', hot: '28万', category: 'tech' },
            { id: 12, title: '某网红直播带货破亿', source: '头条', time: '10小时前', hot: '25万', category: 'hot' },
        ];

        const categoryNames = {
            hot: '热搜', tech: '科技', ent: '娱乐', 
            sport: '体育', finance: '财经', game: '游戏'
        };

        let currentCategory = 'all';
        let newsData = [];

        function renderNews(news) {
            const list = document.getElementById('newsList');
            if (news.length === 0) {
                list.innerHTML = '<div class="loading">暂无内容</div>';
                return;
            }

            list.innerHTML = news.map((item, index) => `
                <div class="news-item" onclick="openNews('${item.title}')">
                    <div class="rank ${index < 3 ? 'rank-' + (index + 1) : 'rank-other'}">${index + 1}</div>
                    <div class="news-content">
                        <div class="news-title">${item.title}</div>
                        <div class="news-meta">
                            <span class="tag">${categoryNames[item.category] || '其他'}</span>
                            <span>${item.source}</span>
                            <span>·</span>
                            <span>${item.time}</span>
                            <span>·</span>
                            <span class="hot">${item.hot}</span>
                        </div>
                    </div>
                    <div class="arrow">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 5l7 7-7 7"/>
                        </svg>
                    </div>
                </div>
            `).join('');
        }

        function loadNews() {
            const list = document.getElementById('newsList');
            list.innerHTML = `
                <div class="skeleton"><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:50%"></div></div>
                <div class="skeleton"><div class="skeleton-line" style="width:75%"></div><div class="skeleton-line" style="width:45%"></div></div>
                <div class="skeleton"><div class="skeleton-line" style="width:85%"></div><div class="skeleton-line" style="width:55%"></div></div>
            `;

            // 模拟网络延迟
            setTimeout(() => {
                newsData = [...mockNews].sort((a, b) => parseInt(b.hot) - parseInt(a.hot));
                filterNews();
            }, 800);
        }

        function filterNews() {
            const filtered = currentCategory === 'all' 
                ? newsData 
                : newsData.filter(item => item.category === currentCategory);
            renderNews(filtered);
        }

        function openNews(title) {
            alert('点击了: ' + title);
        }

        // 分类切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.cat;
                filterNews();
            });
        });

        // 刷新按钮
        document.getElementById('refreshBtn').addEventListener('click', function() {
            this.classList.add('spin');
            loadNews();
            setTimeout(() => this.classList.remove('spin'), 1000);
        });

        // 初始化加载
        loadNews();
    </script>
</body>
</html>
